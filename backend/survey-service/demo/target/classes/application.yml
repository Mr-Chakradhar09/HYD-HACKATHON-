server:
  port: 8082

spring:
  application:
    name: survey-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/survey_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
  cloud:
    config:
      enabled: false
      fail-fast: false
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Security & JWT Configuration
security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # 256-bit key minimum
    expiration: 86400000 # 24 hours in ms
    header: Authorization
    prefix: "Bearer "

# Springdoc OpenAPI Swagger Config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true

# Feign Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

# Resilience4j Circuit Breaker Config
resilience4j:
  circuitbreaker:
    instances:
      authentication-service:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: count_based
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5000 # 5 seconds
        failure-rate-threshold: 50
      ai-service:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 3
        wait-duration-in-open-state: 10000 # 10 seconds
        failure-rate-threshold: 50
      notification-service:
        sliding-window-size: 5
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 3
        wait-duration-in-open-state: 5000 # 5 seconds
        failure-rate-threshold: 50

# Logging Config
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.pulse.survey: DEBUG
