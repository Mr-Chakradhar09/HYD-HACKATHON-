server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/product
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

        - id: warehouse-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/warehouses/**,/api/v1/assignments/**
          filters:
            - name: CircuitBreaker
              args:
                name: warehouseServiceCircuitBreaker
                fallbackUri: forward:/fallback/warehouse
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

        - id: inventory-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/inventories/**,/api/v1/reservations/**,/api/v1/adjustments/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceCircuitBreaker
                fallbackUri: forward:/fallback/inventory
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

        - id: movement-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/movements/**,/api/v1/transfer-requests/**
          filters:
            - name: CircuitBreaker
              args:
                name: movementServiceCircuitBreaker
                fallbackUri: forward:/fallback/movement
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

        - id: replenishment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/replenishment/**
          filters:
            - name: CircuitBreaker
              args:
                name: replenishmentServiceCircuitBreaker
                fallbackUri: forward:/fallback/replenishment
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

        - id: reporting-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/dashboard/**,/api/v1/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: reportingServiceCircuitBreaker
                fallbackUri: forward:/fallback/reporting
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

        - id: forecast-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/forecast/**
          filters:
            - name: CircuitBreaker
              args:
                name: forecastServiceCircuitBreaker
                fallbackUri: forward:/fallback/forecast
            - name: Retry
              args:
                retries: 3
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - StripPrefix=0

    filter:
      chain:
        server-name-resolver:
          enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true

jwt:
  secret: VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ1RoYXRNdXN0QmVBdExlYXN0MzJCeXRlc0xvbmc=

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
