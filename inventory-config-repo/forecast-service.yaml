server:
  port: 8088

spring:
  application:
    name: forecast-service

  datasource:
    url: jdbc:mysql://localhost:3306/inventory_forecast_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true