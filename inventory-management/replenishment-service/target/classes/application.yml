server:
  port: 8085

spring:
  application:
    name: replenishment-service
  datasource:
    url: jdbc:mysql://localhost:3306/replenishment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-regression: true
    register-with-eureka: true

kafka:
  bootstrap-servers: localhost:9092
